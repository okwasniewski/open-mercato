name: CI for Develop&Main
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Build-time flags for the app `prepare` compiles. They mirror the snapshot
  # env so the CI build exercises the same module registry as the preview app.
  #
  # OM_OPTIMISTIC_LOCK=all activates the auto-registered generic reader for
  # every CRUD route (Phase 13 of #1981). Default ON since Phase 14; kept
  # explicit to make the intent obvious in CI logs.
  OM_OPTIMISTIC_LOCK: 'all'
  SELF_SERVICE_ONBOARDING_ENABLED: 'true'
  # Enterprise modules MUST be set at BUILD time: `apps/mercato/src/modules.ts`
  # reads these four flags to decide which enterprise modules enter
  # `enabledModules`, and `yarn generate` bakes that registry into
  # `.mercato/generated/` before `yarn build:app` compiles it. All four are
  # required; the umbrella flag alone does not enable sso/security/agent_orchestrator.
  OM_ENABLE_ENTERPRISE_MODULES: 'true'
  OM_ENABLE_ENTERPRISE_MODULES_SSO: 'true'
  OM_ENABLE_ENTERPRISE_MODULES_SECURITY: 'true'
  OM_ENABLE_ENTERPRISE_MODULES_AGENTS: 'true'
  # turbo 2.x defaults to `envMode: "strict"`, and turbo.json declares only
  # `globalEnv: ["NODE_ENV"]`. Both `yarn generate` and `yarn build:app` run
  # through `turbo run`, so in strict mode turbo STRIPS every OM_* variable
  # above before the task process starts. `loose` passes the full environment
  # through to tasks.
  #
  # Caveat worth knowing: loose mode changes only what tasks can SEE, not what
  # turbo hashes. These flags are still absent from the cache key, so a cached
  # `build` produced before this change can in principle be restored. Declaring
  # them in turbo.json `globalEnv` would fix both passthrough and hashing and is
  # the better long-term fix; it is deliberately left out of this change.
  TURBO_ENV_MODE: 'loose'
  # NEXT_PUBLIC_* values are inlined by Next.js at build time. The Docker image
  # builds are unaffected: `docker/build-push-action` forwards no job env.
  NEXT_PUBLIC_DOCUMENTS_COLLAB_URL: 'ws://127.0.0.1:4101'

# `feat/wms` is a temporary stacking base. PRs stacked on it target that branch rather than
# `develop`, and while it is absent from these lists no job is scheduled for them at all.
# Drop the entry once its stack has landed on `develop`.
on:
  push:
    branches:
      - main
      - develop
      - feat/wms
  pull_request:
    branches:
      - main
      - develop
      - feat/wms

# Cancel any in-progress run on the same branch when a new push arrives.
# Prevents multiple long runs queuing up from rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Shared build ────────────────────────────────────────────────────────────
  # Installs deps, compiles all packages, runs the code generator, and builds
  # the Next.js app. Also computes the app build scope so CI/docs-only PRs
  # skip the app and Docker builds.
  #
  # Uploads one artifact:
  #   build-artifacts  — packages/*/dist/ + generated files (needed by test)
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      skip_app_build: ${{ steps.app-scope.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Depth 2 brings in the merge commit's first parent, which the scope
          # step diffs against (see audit-scope for why not `origin/<base>`).
          fetch-depth: 2

      - name: Compute app build scope
        # Decides whether the Next.js app build and Docker image builds run.
        # CI/docs/scripts-only PRs skip both: no app source changed.
        id: app-scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD^1 HEAD)

          # These paths affect behaviour across all modules.
          SHARED_PATTERN='^packages/shared/|^packages/ui/|^packages/events/|^packages/queue/|^packages/cache/|^packages/search/|^packages/onboarding/|^packages/webhooks/|^packages/core/src/lib/|^packages/enterprise/src/lib/|^apps/mercato/src/(app|lib|components|layout\.|page\.)'
          if echo "$CHANGED" | grep -qE "$SHARED_PATTERN"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Match any workspace package or app that follows the src/modules/ convention.
          MODULES=$(echo "$CHANGED" | \
            grep -oP '(?:packages/[^/]+|apps/[^/]+)/src/modules/\K[^/]+' | \
            sort -u | paste -sd,)

          if [ -z "$MODULES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        # With nodeLinker:node-modules, yarn extracts zips into node_modules even
        # when .yarn/cache hits — the extraction alone is ~85s. Caching node_modules
        # directly and skipping install on hit eliminates that cost.
        id: nm-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Cache Turbo build outputs
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: bash "$GITHUB_WORKSPACE/scripts/ci/yarn-retry-on-install-crash.sh" yarn install --immutable

      - name: Build packages
        # Always builds all packages — no filter. Turbo cache handles the speedup:
        # unchanged packages are cache hits and restored to disk in milliseconds.
        # Filtering here would produce an incomplete artifact, breaking downstream
        # jobs that need every package's dist/ output.
        run: yarn build:packages
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Prepare generated modules
        # Always run fully — generator discovers all modules regardless of what
        # changed, and its output is consumed by the app, not packages.
        run: yarn generate

      - name: Rebuild packages with generated files
        run: yarn build:packages
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Build app
        # distDir is .mercato/next (set in apps/mercato/next.config.ts).
        # Skipped for CI/docs-only PRs - no app source changed.
        if: steps.app-scope.outputs.skip != 'true'
        run: yarn build:app

      - name: Check Documents bundle budgets
        if: steps.app-scope.outputs.skip != 'true'
        run: yarn documents:check-bundles

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            packages/*/dist/
            packages/*/generated/
            apps/mercato/.mercato/generated/
          retention-days: 1
          if-no-files-found: error

  # ── Audit scope ─────────────────────────────────────────────────────────────
  # Determines whether dependency audit needs to run. Package manifests and
  # lockfiles are the only inputs that can change the dependency graph.
  audit-scope:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      should_run: ${{ steps.dependency-files.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # A pull_request checkout is GitHub's merge commit; its first parent is
          # the base commit the PR was merged onto, so depth 2 is enough to diff
          # exactly the PR's own changes.
          fetch-depth: 2

      - name: Detect dependency file changes
        id: dependency-files
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Diff against the merge commit's first parent, NOT the current tip of
            # the base branch. The merge commit is frozen when the run is created,
            # while the base branch keeps moving: diffing against a freshly fetched
            # `origin/<base>` also reports every file the base branch changed since
            # then, so a re-run of a UI-only PR after develop bumped `yarn.lock`
            # ran (and failed) the audit (#6753).
            CHANGED=$(git diff --name-only HEAD^1 HEAD)
          else
            BEFORE="${{ github.event.before }}"

            if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
              CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
            else
              git fetch --no-tags --depth=1 origin "$BEFORE" || true

              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                CHANGED=$(git diff --name-only "$BEFORE" HEAD)
              else
                CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
              fi
            fi
          fi

          DEPENDENCY_FILE_PATTERN='(^|/)package\.json$|(^|/)(yarn\.lock|package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|bun\.lock|bun\.lockb)$'

          if printf '%s\n' "$CHANGED" | grep -Eq "$DEPENDENCY_FILE_PATTERN"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Security audit ──────────────────────────────────────────────────────────
  # Runs only when package manifests or lockfiles changed. Advisories published
  # against an unchanged graph are covered by the daily
  # `.github/workflows/audit.yml` instead — this job is the change-triggered
  # half of the pair (#4479).
  audit:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: audit-scope
    if: needs.audit-scope.outputs.should_run == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Depth 2 brings in the merge commit's first parent, whose yarn.lock is
          # the PR's audit baseline.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # There is deliberately no cached `.audit-passed` marker here. It used to
      # be keyed on manifest/lockfile content, but `yarn npm audit` output is a
      # function of the dependency graph AND the advisory database at run time:
      # a marker written before an advisory was published kept satisfying the
      # key afterwards, so the scan silently did not execute and the job
      # reported green on a graph that was by then vulnerable (#4479).
      - name: Cache node_modules
        # Shared key with other jobs — whichever runs first saves it.
        id: nm-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: bash "$GITHUB_WORKSPACE/scripts/ci/yarn-retry-on-install-crash.sh" yarn install --immutable

      - name: Check for dead resolution keys
        # Runs before the audit because a dead `resolutions` key is a *cause* of the
        # failure the next step reports, and nothing else surfaces it: Yarn silently
        # ignores a resolution whose `@npm:<descriptor>` suffix matches no descriptor
        # in the tree, so a security pin stops applying the moment its requester bumps
        # its declared range. All four `undici` keys had rotted that way before #5085,
        # and the only symptom was a red audit with nothing in the diff to explain it
        # (#5098). This job is the right home for the check because `audit-scope` gates
        # it on exactly the inputs that can rot a key — manifests and lockfiles.
        run: yarn check:resolutions

      - name: Resolve audit baseline lockfile
        # This job gates the CHANGE, so it fails only on advisories the change
        # introduces: an advisory already flagged on the base yarn.lock is
        # reported but not blocking. Otherwise a PR adding one clean dependency
        # stays red for every advisory already on develop (#5868). Those are
        # owned by the scheduled `.github/workflows/audit.yml`, which audits
        # without a baseline and keeps a tracking issue open until fixed.
        # When no baseline can be resolved the audit runs strict (fails closed).
        id: audit-baseline
        shell: bash
        run: |
          set -uo pipefail
          BASELINE="$RUNNER_TEMP/baseline-yarn.lock"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="HEAD^1"
          else
            BASE_REF="${{ github.event.before }}"
            if [ -n "$BASE_REF" ] && ! [[ "$BASE_REF" =~ ^0+$ ]]; then
              git fetch --no-tags --depth=1 origin "$BASE_REF" || true
            else
              BASE_REF=""
            fi
          fi

          if [ -n "$BASE_REF" ] && git show "$BASE_REF:yarn.lock" > "$BASELINE" 2>/dev/null; then
            echo "args=--baseline $BASELINE" >> "$GITHUB_OUTPUT"
            echo "Auditing against baseline yarn.lock from $BASE_REF."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice::No baseline yarn.lock available — auditing strictly."
          fi

      - name: Audit dependencies for known CVEs
        # Uses scripts/audit-ci.mjs instead of `yarn npm audit` as a workaround for
        # an npm registry bug: the bulk advisories endpoint returns a gzip body with
        # no `Content-Encoding` header, so yarn 4.x fails with a JSON ParseError
        # before evaluating any advisory. The script runs the same high+ severity
        # gate over every resolved package with defensive gunzip and fails closed.
        # Revert to `yarn npm audit --all --recursive --severity high` once npm
        # restores the encoding header on that endpoint.
        run: node scripts/audit-ci.mjs --severity high ${{ steps.audit-baseline.outputs.args }}

  # ── Lint ─────────────────────────────────────────────────────────────────────
  # Fast static analysis — runs in parallel with prepare and audit.
  # ESLint does not need compiled packages, so it can fail fast before heavy jobs.
  # @open-mercato/app is the only workspace with a `lint` script, so it must stay
  # in scope: excluding it left turbo with zero commands and a permanently green
  # no-op job (issue #4472).
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: bash "$GITHUB_WORKSPACE/scripts/ci/yarn-retry-on-install-crash.sh" yarn install --immutable

      - name: Guard against an empty lint task graph
        # Fails when `turbo run lint` resolves to zero commands, so a future
        # filter or script rename cannot silently disable the gate again.
        run: yarn lint:check-graph

      - name: Lint
        run: yarn lint

      - name: Guard against unmet peer dependencies in published packages
        # A peer that only lives in devDependencies resolves fine through the
        # monorepo's hoisted node_modules but is absent from a standalone app,
        # which installs dependencies + peerDependencies only. No PR job builds a
        # standalone app, so without this gate the break first appears post-merge
        # in the snapshot workflow's `Standalone App Smoke`.
        # Pre-existing cases are pinned in scripts/package-peer-deps-allowlist.json.
        run: yarn packages:check-peer-deps

      - name: Guard against raw console.* logging
        # Blocking since the application-wide migration to the structured
        # logging facade (see .ai/specs/2026-07-02-structured-logging-facade.md).
        # Intentional stdout (CLI output, module cli.ts) is allowlisted in
        # scripts/logger-console-allowlist.json.
        run: yarn logger:check-console:ci

  # ── DS lint (advisory) ──────────────────────────────────────────────────────
  # Reports per-rule DS lint counts and the delta vs the base branch on every
  # PR. Advisory by construction: joins no `needs` chain and is not a required
  # status check — making it required is gated on the first per-module `error`
  # flip (see .ai/specs/2026-07-05-ds-lint-ci-escalation-and-alert-migration.md,
  # Workstream 1). Runs in parallel with the heavy jobs: the plugin is plain JS
  # and @typescript-eslint/parser needs no compiled packages. Both lint runs
  # use the HEAD's plugin + config so rule changes in the PR cannot skew the
  # comparison. ESLint is invoked through the TypeScript 7 require hook — the
  # native compiler has no JS API, so the parser's `typescript` import must be
  # redirected to `typescript-js`.
  ds-lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write   # sticky comment; no-op on fork PRs (read-only token)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: bash "$GITHUB_WORKSPACE/scripts/ci/yarn-retry-on-install-crash.sh" yarn install --immutable

      - name: DS lint (head)
        # `|| true`: the report must be published even when error-level
        # findings exist; enforcement is the separate `--check` step below.
        run: |
          node --require ./scripts/typescript-js-require-hook.cjs \
            node_modules/eslint/bin/eslint.js --config eslint.ds.config.mjs \
            packages apps --format json --output-file /tmp/ds-head.json || true

      - name: DS lint (base)
        # Same plugin + config as the head run: flat-config `files` globs
        # resolve against cwd (the base worktree) while the config's imports
        # resolve against the config file's own location in the head checkout.
        # Isolated in its own step so a failure (e.g. a base predating the DS
        # config) degrades to "delta n/a (no base data)" in the report.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git worktree add /tmp/ds-base origin/${{ github.base_ref }}
          (cd /tmp/ds-base && node --require "$GITHUB_WORKSPACE/scripts/typescript-js-require-hook.cjs" \
            "$GITHUB_WORKSPACE/node_modules/eslint/bin/eslint.js" \
            --config "$GITHUB_WORKSPACE/eslint.ds.config.mjs" \
            packages apps --format json --output-file /tmp/ds-base.json) || true

      - name: Report
        id: ds-report
        run: |
          node scripts/ci/ds-lint-report.mjs /tmp/ds-head.json /tmp/ds-base.json \
            --base-dir /tmp/ds-base --comment-file /tmp/ds-lint-comment.md

      - name: Sticky PR comment
        # Same-repo PRs only (fork PRs have a read-only token and rely on the
        # job summary). Created only when the delta is non-zero or error-level
        # findings exist; an existing comment is updated in place (never
        # duplicated) — including back to "+0" when a delta is reverted.
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          SHOULD_COMMENT: ${{ steps.ds-report.outputs.should_comment }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- ds-lint-report -->'
            const body = fs.readFileSync('/tmp/ds-lint-comment.md', 'utf8')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else if (process.env.SHOULD_COMMENT === 'true') {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

      - name: Enforce error-level findings
        # Exit 0 while all findings are warn-level; error-level findings
        # (post-escalation, Workstream 2) fail the job — the enforcement teeth
        # once per-module flips begin.
        run: node scripts/ci/ds-lint-report.mjs --check /tmp/ds-head.json

  # ── Quality checks ──────────────────────────────────────────────────────────
  # Typechecking and unit tests.
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [prepare, audit-scope, audit, lint]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.audit-scope.result == 'success' &&
      (needs.audit.result == 'success' || needs.audit.result == 'skipped') &&
      needs.lint.result == 'success'
    env:
      # app typecheck (tsc --noEmit on the full Next.js app) peaks at ~4 GB;
      # raise the heap so it does not OOM on cache-miss runs.
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch base branch for change detection
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-markitdown-v2
          restore-keys: pip-markitdown-

      - name: Upgrade pip
        # Upgrade pip in its own invocation: the system pip (24.0) resolver
        # backtracks through markitdown versions and dead-ends on markdownify
        # (ResolutionImpossible). A combined `pip install --upgrade pip markitdown`
        # does NOT help because the newer resolver only takes effect on the next
        # invocation. Splitting the upgrade out lets the install below run on the
        # modern resolver.
        run: python3 -m pip install --upgrade pip

      - name: Install markitdown CLI
        # Pin the version so resolution is deterministic and a future
        # markitdown/markdownify release cannot break CI without an explicit bump.
        run: python3 -m pip install 'markitdown==0.1.6'

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: bash "$GITHUB_WORKSPACE/scripts/ci/yarn-retry-on-install-crash.sh" yarn install --immutable

      - name: Cache Turbo build outputs
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts

      - name: Check CLASSIC DI injection survives bundling
        # Reads packages/*/dist, so it must stay after the artifact download.
        # Awilix CLASSIC resolves a factory's dependencies by PARAMETER NAME, and
        # esbuild renames a parameter that shadows an enclosing binding — so a
        # registration can be correct in source, pass under ts-jest, and still
        # throw AwilixResolutionError in the published package. Source-level
        # checks cannot see this; only the built artefact can.
        run: yarn check:classic-di-injection

      - name: Check dependency version conflicts
        run: yarn check:dep-versions

      - name: Check paginated lists forward totalIsCapped
        run: yarn check:pagination-capped

      - name: Check i18n sync
        run: yarn tsx scripts/i18n-check-sync.ts

      - name: Check i18n usage
        run: yarn i18n:check-usage
        continue-on-error: true

      - name: Check for time-bomb test literals
        run: yarn check:time-bombs:fail

      - name: Check agent instruction budget
        # The root AGENTS.md must fit Codex's default 32 KiB project-instruction budget,
        # and the already-oversized root-to-module chains may only shrink (#4484).
        run: yarn agents:check-budget

      - name: Checking types
        # On PRs: scope to packages/app that changed since the base branch.
        # On pushes to protected branches: full typecheck, no filter.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            yarn turbo run typecheck --filter=[origin/${{ github.base_ref }}]...
          else
            yarn typecheck
          fi
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Test
        # Same scoping as typecheck — affected packages only on PRs.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            yarn turbo run test --filter=[origin/${{ github.base_ref }}]...
          else
            yarn test
          fi

      - name: Test scripts
        # Turbo never picks up root-level scripts — run explicitly.
        run: yarn test:scripts

      - name: Check DS token snapshot drift (always, unfiltered)
        # .ai/ds/ds-tokens.json is the committed canonical mirror of the token
        # blocks in apps/mercato/src/app/globals.css. It is not a package, so
        # the turbo-scoped Test step never guards it — check explicitly, like
        # the template-parity guard below: a PR that edits a token without
        # running `yarn ds:tokens` fails here instead of drifting silently.
        run: yarn ds:tokens:check

      - name: Check lucide icon registry drift (always, unfiltered)
        # packages/ui/src/backend/icons/lucideRegistry.generated.tsx is emitted
        # from a repo-WIDE scan for `icon: '<name>'` strings, so the PR that
        # drifts it usually touches another package entirely. turbo's
        # --filter=[base]... selects a changed package and its DEPENDENTS, and
        # packages/ui is a dependency of those packages rather than a dependent,
        # so any guard living in ui's own suite is skipped on exactly the PRs
        # that break it — which is how #4391 added `icon: 'bot'` and left the
        # registry stale until #5651. Same reasoning as the DS token check above.
        run: yarn ui:icons:check

      - name: Check create-app template parity (always, unfiltered)
        # The create-app package guards byte-parity between the monorepo app shell
        # (apps/mercato/**) and the standalone template (packages/create-app/template/**).
        # Those guards read files across BOTH trees, but the turbo-scoped "Test" step
        # above uses --filter=[base]... which selects packages by the dependency graph
        # and never pulls in create-mercato-app when only apps/mercato changes — so on
        # PRs the parity tests can silently skip while the post-merge push build (full,
        # unfiltered `yarn test`) turns develop red (see #3779). Run the create-app unit
        # suite unconditionally here so template drift fails the PR, not develop.
        run: yarn workspace create-mercato-app test

      - name: Run repo-wide audit guards (always, unfiltered)
        # Same class as the create-app parity step above, generalized (#4534). A handful of
        # tests are repo-wide AUDITS rather than package unit tests: they deliberately scan
        # other packages, apps/ or scripts/. The turbo filter selects packages, not paths, so
        # a PR touching only scripts/ selects no package and those audits never run — the
        # violation then lands on develop and the post-merge unfiltered `yarn test` goes red
        # for everyone (#4527). Run them unconditionally so they fail their own PR — do not
        # move this step behind an `if:`, or the silent skip comes straight back.
        #
        # The guards are enumerated in exactly one place: REPO_WIDE_GUARDS in
        # scripts/repo-wide-guards.mjs, where each entry carries the reason it is repo-wide.
        # Print the current set with `yarn test:repo-wide-guards --list`. This comment does
        # not repeat it: a second copy went stale the first time a guard was added (#4770),
        # and a stale list in CI config is worse than none because the next reader trusts it.
        # scripts/__tests__/repo-wide-guards.test.mjs fails if the enumeration reappears here.
        #
        # Not here because they already run unfiltered: the create-app parity guards (step
        # above), `yarn agents:check-budget`, `yarn test:scripts`. All guards are static file
        # scans — the whole set is ~10 s, so it stays on the common PR path.
        run: yarn test:repo-wide-guards

  # ── Documents multi-instance durability ────────────────────────────────────
  # The standard Documents Jest suite intentionally skips this infrastructure
  # regression. Run it as a dedicated required job on GitHub's Docker-capable
  # runner so every change proves the two-sidecar Redis/PostgreSQL persistence
  # path rather than relying on an opt-in local command.
  documents-multi-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare, audit-scope, audit, lint]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.audit-scope.result == 'success' &&
      (needs.audit.result == 'success' || needs.audit.result == 'skipped') &&
      needs.lint.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: bash "$GITHUB_WORKSPACE/scripts/ci/yarn-retry-on-install-crash.sh" yarn install --immutable

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts

      - name: Run real two-sidecar durability regression
        run: yarn workspace @open-mercato/documents test:multi-instance

  # ── Docker image builds ──────────────────────────────────────────────────────
  # Validates all Dockerfiles build cleanly. Runs in parallel with test so it
  # does not add to wall time on PRs where Docker rebuilds are fast (GHA cache hit).
  #
  # Skipped for CI/docs/scripts-only PRs (skip_app_build == 'true'): those
  # changes do not affect app source or Dockerfiles, so the Docker image is
  # identical to the last build and there is nothing to validate. This avoids
  # a 10+ min rebuild caused by Docker layer cache busting when files like
  # turbo.json or scripts/ are the only things that changed.
  docker-build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: prepare
    # Only run on non-fork PRs and direct pushes (forks don't have access to GHA cache).
    # Also skip for CI/docs-only PRs — no app code changed, image is unchanged.
    if: |
      needs.prepare.outputs.skip_app_build != 'true' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          # One builder serves all three Dockerfile builds in this job, so they share one
          # layer cache — same as v1, where the key defaulted to the repository name.
          cache-key: ci-docker-build

      - name: Build docs Dockerfile
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/docs/Dockerfile
          push: false

      - name: Build fullapp (main app)
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          push: false

      - name: Build opencode container
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./docker/opencode
          push: false
